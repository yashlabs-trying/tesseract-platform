schema_version: tesseract.platform.source-manifest.v2
generated_at: "2026-11-23"
description: >-
  Foundry, Fusion and Adaptive live in this repository under products/ (their
  histories were merged in). Ignite is the separate kubbernetd-saver repository.
  The control plane integrates with every product only through the versioned
  contracts in contracts/; it never imports product internals.

products:
  foundry:
    role: profiling-and-measurement
    path: products/foundry
    pinned_commit: in-tree
    python_package: foundry
    emits_contract: tesseract.performance-profile.v1

  fusion:
    role: placement-and-reservation
    path: products/fusion
    pinned_commit: in-tree
    python_package: fusion

  ignite:
    role: deployment-and-routing
    repository: https://github.com/yashlabs-trying/kubbernetd-saver
    default_branch: main
    pinned_commit: IGNITE_COMMIT
    python_package: kubbernetd
    crd: replicagroups.kubbernetd.io

  adaptive:
    role: adaptive-quantization
    path: products/adaptive
    pinned_commit: in-tree
    python_package: adaptive
    integration: optional-and-disabled
    note: >-
      The platform integrates through an optional AdaptivePrecisionProvider
      contract and must operate fully when Adaptive is absent.
