apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-platform
  namespace: {{ .Release.Namespace }}
  labels:
    app: tesseract-platform
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: tesseract-platform
  template:
    metadata:
      labels:
        app: tesseract-platform
    spec:
      containers:
        - name: platform
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tesseract-platform", "serve"]
          ports:
            - containerPort: 8088
          env:
            - name: TESSERACT_CONTROLLER_MODE
              value: {{ .Values.controller.mode | quote }}
            - name: TESSERACT_CONTROLLER_ACTION_BUDGET
              value: {{ .Values.controller.actionBudget | quote }}
            - name: TESSERACT_FOUNDRY_URL
              value: {{ .Values.foundryUrl | quote }}
            - name: TESSERACT_FUSION_URL
              value: {{ .Values.fusionUrl | quote }}
            - name: TESSERACT_IGNITE_NAMESPACE
              value: {{ .Values.igniteNamespace | quote }}
            - name: TESSERACT_ADAPTIVE_ENABLED
              value: {{ .Values.adaptiveEnabled | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8088
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8088
          resources:
{{ toYaml .Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-platform
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: tesseract-platform
  ports:
    - name: http
      port: 8088
      targetPort: 8088
