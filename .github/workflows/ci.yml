name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" ruff
      - name: Validate contracts
        run: python -m tesseract_platform.cli validate-contracts
      - name: Lint
        run: ruff check .
      - name: Docs check
        run: |
          for f in README.md docs/ARCHITECTURE.md docs/INTEGRATION_CONTRACTS.md docs/AUDIT.md docs/OPERATIONS.md docs/ADAPTIVE_INTEGRATION.md docs/MAC_VALIDATION.md docs/GPU_VALIDATION.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Unit, contract and integration tests
        run: python -m pytest -m "not gpu and not kubernetes" -o addopts='' -q
