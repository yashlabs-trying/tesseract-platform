name: Products

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: products-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.product }} (py3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [foundry, fusion, adaptive]
    defaults:
      run:
        working-directory: products/${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch (adaptive)
        if: matrix.product == 'adaptive'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: pip install -e ".[dev]" pytest pytest-asyncio hypothesis httpx
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
