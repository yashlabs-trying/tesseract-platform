apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tesseract-fusion.fullname" . }}
  labels:
    app: tesseract-fusion
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: tesseract-fusion
  template:
    metadata:
      labels:
        app: tesseract-fusion
    spec:
      containers:
        - name: fusion
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
