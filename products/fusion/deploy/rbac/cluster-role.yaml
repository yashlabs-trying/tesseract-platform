apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tesseract-fusion-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/status", "nodes/status"]
    verbs: ["get", "list"]
