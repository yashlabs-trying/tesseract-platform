[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-fusion"
version = "0.1.0"
description = "GPU fleet economics and optimization platform"
authors = [{name = "Tesseract Fusion Team"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "rich>=13.0",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "httpx>=0.27",
]
k8s = ["kubernetes>=30.0"]
or-tools = ["ortools>=9.10"]
postgres = ["asyncpg>=0.29", "psycopg2-binary>=2.9"]
all = [
    "tesseract-fusion[k8s,or-tools,postgres]",
]

[project.scripts]
fusion = "fusion.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fusion*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: requires real GPU hardware (skip by default)",
    "cloud: requires cloud connectivity",
    "slow: long-running tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
