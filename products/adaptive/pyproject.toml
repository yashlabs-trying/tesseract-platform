[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-adaptive"
version = "0.1.0"
description = "Autonomous, quality-constrained, workload-aware quantization and model precision optimization"
readme = "README.md"
authors = [{ name = "Tesseract Adaptive Team" }]
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "jsonschema>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
models = ["transformers>=4.44"]
gpu = [
    "bitsandbytes>=0.43",
    "auto-gptq>=0.7; platform_system != 'Darwin'",
    "autoawq>=0.2; platform_system != 'Darwin'",
]
all = ["tesseract-adaptive[torch,models,dev]"]

[project.scripts]
adaptive = "adaptive.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adaptive*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = [
    "UP042",  # str+Enum is used deliberately for platform consistency
]

[tool.ruff.lint.per-file-ignores]
"src/adaptive/cli/**" = ["B008"]  # Typer uses function calls as defaults by design
"tests/**" = ["E402"]  # importorskip must run before third-party imports

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "gpu: tests that require NVIDIA CUDA hardware",
    "slow: long-running tests",
    "network: tests that download models or datasets",
]
