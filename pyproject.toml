[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseract-platform"
version = "0.1.0"
description = "Unified orchestration and optimization layer connecting Tesseract Foundry, Fusion and Ignite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yash Labs", email = "novalabs0.ai@gmail.com" }]
keywords = ["tesseract", "orchestration", "gpu", "inference", "kubernetes"]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
dev = ["ruff>=0.4", "mypy>=1.10"]

[project.scripts]
tesseract-platform = "tesseract_platform.cli:main"

[tool.setuptools.packages.find]
include = ["tesseract_platform*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "integration: exercises real platform integration code with in-process fakes",
  "kubernetes: requires a live Kubernetes cluster",
  "gpu: requires NVIDIA GPU hardware",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
